<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacofre — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4' y1='4' x2='36' y2='34' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%239184D9'/%3E%3Cstop offset='1' stop-color='%235B4FA8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='9' y='6' width='10' height='23' rx='4' fill='url(%23g)'/%3E%3Crect x='9' y='21' width='24' height='9' rx='4' fill='url(%23g)'/%3E%3Cpath d='M5 27 L15 16 L21 21 L29 11' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpolygon points='31.5,8 31,15.5 24,10' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    (function () {
      var theme = localStorage.getItem('coinflow-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="6" width="10" height="23" rx="4" fill="#ffffff"></rect>
          <rect x="9" y="21" width="24" height="9" rx="4" fill="#ffffff"></rect>
          <path d="M5 27 L15 16 L21 21 L29 11" stroke="#D2CEFD" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
          <polygon points="31.5,8 31,15.5 24,10" fill="#D2CEFD"></polygon>
        </svg>
        <span>Lacofre</span>
      </div>
      <h2>Sua saúde financeira, organizada em um só lugar.</h2>
      <p>Acompanhe entradas, saídas e saldo em tempo real, com gráficos claros e categorias que mostram para onde seu dinheiro está indo.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-card fade-in">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Entrar</button>
          <button type="button" class="auth-tab" data-tab="cadastro">Criar conta</button>
        </div>

        <form id="login-form" class="auth-form active">
          <h1 class="auth-title">Bem-vindo de volta</h1>
          <p class="auth-subtitle">Entre com sua conta para continuar.</p>

          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="voce@email.com" required />
          </div>

          <div class="field">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" name="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-primary auth-submit">Entrar</button>
          <p class="form-error" id="login-error"></p>
        </form>

        <form id="cadastro-form" class="auth-form">
          <h1 class="auth-title">Crie sua conta</h1>
          <p class="auth-subtitle">Leva menos de um minuto.</p>

          <div class="field">
            <label for="cadastro-name">Nome</label>
            <input type="text" id="cadastro-name" name="name" placeholder="Seu nome" required />
          </div>

          <div class="field">
            <label for="cadastro-email">Email</label>
            <input type="email" id="cadastro-email" name="email" placeholder="voce@email.com" required />
          </div>

          <div class="field">
            <label for="cadastro-password">Senha</label>
            <input type="password" id="cadastro-password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required />
          </div>

          <button type="submit" class="btn-primary auth-submit">Criar conta</button>
          <p class="form-error" id="cadastro-error"></p>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
